[project]
name = "aozora-bunko-backend"
version = "0.1.0"
description = "Aozora Bunko RAG book-selection backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentence-transformers>=3.3",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40",
    "requests>=2.32",
    "tqdm>=4.67",
    "pydantic-settings>=2.6",
    "aozorabunko-extractor>=0.1.0",
]

[tool.uv]
package = false
